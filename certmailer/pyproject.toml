[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certmailer"
version = "0.1.0"
description = "Cross-platform TUI prototype for matching and emailing participant certificates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=0.80,<2.0",
  "openpyxl>=3.1,<4.0",
  "platformdirs>=4.2,<5.0",
  "google-api-python-client>=2.130,<3.0",
  "google-auth-httplib2>=0.2,<1.0",
  "google-auth-oauthlib>=1.2,<2.0",
  "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.5,<1.0"]

[project.scripts]
certmailer = "certmailer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
